<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Horn Tuner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div class="top-row">
      <div class="note-buttons">
        <button data-note="A">A</button>
        <button data-note="B">B</button>
        <button data-note="C">C</button>
        <button data-note="D">D</button>
        <button data-note="E">E</button>
        <button data-note="F">F</button>
        <button data-note="G">G</button>
      </div>
      <!-- Mic toggle removed -->
    </div>

    <div class="main-panel">
      <div class="note-display">
        <div id="targetNote">–</div>
        <div id="currentFreq">0.0 Hz</div>
      </div>

      <div class="tuning-meter">
        <div class="meter-label">flat</div>
        <div class="meter-bar">
          <div id="meterNeedle"></div>
          <div class="meter-center-line"></div>
        </div>
        <div class="meter-label">sharp</div>
      </div>

      <div class="cents-display">
        <span id="centsValue">0</span>
        <span>cents</span>
      </div>
    </div>
  </div>

  <audio id="audio_A" src="horn_A4.mp3"></audio>
  <audio id="audio_B" src="horn_B4.mp3"></audio>
  <audio id="audio_C" src="horn_C5.mp3"></audio>
  <audio id="audio_D" src="horn_D5.mp3"></audio>
  <audio id="audio_E" src="horn_E5.mp3"></audio>
  <audio id="audio_F" src="horn_F5.mp3"></audio>
  <audio id="audio_G" src="horn_G5.mp3"></audio>

  <script type="module" src="main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
